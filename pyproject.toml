[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coding-agent"
version = "0.1.0"
description = "LangGraph-based terminal-native coding agent with WSL2 sandbox"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0",
    "aiosqlite>=0.20",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langsmith>=0.1.100",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    # 集成测试全是 wsl.exe 进程启动，串行跑要十分钟；并行后 1 分钟内
    "pytest-xdist>=3.6",
    "pytest-cov>=5.0",
]
ui = [
    "textual>=0.80",
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
agent = "coding_agent.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# 默认并行：集成测试的开销几乎全在 wsl.exe 进程启动上（每次约 0.3s），
# 串行跑一遍要十分钟，且完全受 I/O 限制，并行几乎线性加速。
addopts = "-q -n auto --dist loadfile"
markers = [
    "wsl: 需要本机可用的 WSL2 发行版",
    "llm: 需要 DEEPSEEK_API_KEY",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
