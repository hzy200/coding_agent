<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodingAgent</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="login" class="login hidden">
  <div class="login-box">
    <h2>CodingAgent</h2>
    <p>输入访问 token（由管理员分配）</p>
    <input type="password" id="token-input" autocomplete="off" placeholder="Bearer token">
    <div class="login-error" id="login-error"></div>
    <button id="token-save">进入</button>
  </div>
</div>

<header>
  <span class="name">CodingAgent</span>
  <span class="meta" id="health">检查中…</span>
  <span class="meta" id="thread"></span>
  <span class="meta" id="state">就绪</span>
  <span class="spacer"></span>
  <button id="logout">退出</button>
</header>

<div id="controls">
  <button id="pause">暂停</button>
  <button id="cancel">取消</button>
  <select id="steer-action">
    <option value="add">add</option>
    <option value="replan">replan</option>
  </select>
  <select id="steer-role">
    <option value="explore">explore</option>
    <option value="review">review</option>
    <option value="test">test</option>
  </select>
  <input type="text" id="steer-text" placeholder="add/replan 说明">
  <button id="steer">发送指令</button>
  <button id="resume">恢复</button>
</div>

<main>
  <aside>
    <h3>会话</h3>
    <ul id="sessions"></ul>
    <button id="new">新会话</button>
  </aside>

  <div id="main-col">
    <div id="log"></div>
    <footer>
      <input type="text" id="prompt" placeholder="输入指令，回车发送…" autocomplete="off">
      <button id="send">发送</button>
    </footer>
  </div>
</main>

<script src="/static/app.js"></script>
</body>
</html>
