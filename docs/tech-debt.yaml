    resolved: 2026-10-21
    how: 结果进入合并队列时立即置 merging 并离开 pending
    regression: test_completed_implement_is_not_relaunched_while_waiting_for_merge
    see: docs/postmortem/2026-10-21-orchestrated-write.md
